services:
  - type: web
    name: badminton-ai-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: badminton-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: badminton-ai-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /var/data/uploads
      - key: OPENROUTER_API_KEY
        sync: false
    disk:
      name: badminton-ai-uploads
      mountPath: /var/data
      sizeGB: 10

  - type: worker
    name: badminton-ai-worker
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A app.workers.celery_app worker --loglevel=info"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: badminton-ai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: badminton-ai-redis
          property: connectionString
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "false"
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /var/data/uploads
      - key: OPENROUTER_API_KEY
        sync: false
    disk:
      name: badminton-ai-uploads
      mountPath: /var/data
      sizeGB: 10

  - type: redis
    name: badminton-ai-redis
    plan: starter
    ipAllowList: []

databases:
  - name: badminton-ai-db
    plan: starter
