# Deploy with: fly launch --no-deploy (first time, to review), then fly deploy
# Requires a separate `fly postgres create` and `fly redis create` (Upstash-backed),
# then `fly secrets set DATABASE_URL=... REDIS_URL=... JWT_SECRET_KEY=... OPENROUTER_API_KEY=...`
#
# NOTE: this single-process config runs the API only. Celery works in eager
# mode (CELERY_TASK_ALWAYS_EAGER=true, the default) so it needs no separate
# worker machine. For a real production deployment with a dedicated worker
# process, run a second `fly.worker.toml` app with the same secrets and
# `celery -A app.workers.celery_app worker` as its start command, and switch
# storage from local disk to S3 (implement `S3StorageBackend` in
# app/core/storage.py) since a local Fly volume is not shared between machines.

app = "badminton-ai-api"
primary_region = "iad"

[build]

[env]
  CELERY_TASK_ALWAYS_EAGER = "true"
  STORAGE_BACKEND = "local"
  LOCAL_STORAGE_DIR = "/data/uploads"

[[mounts]]
  source = "badminton_ai_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/health"
  interval = "30s"
  timeout = "5s"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"

[deploy]
  release_command = "alembic upgrade head"
