<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Processing — Badminton AI</title>
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="../../components/app-nav/app-nav.css" />
  <link rel="stylesheet" href="../../styles/app-shell.css" />
  <link rel="stylesheet" href="./processing.css" />
</head>
<body>
  <script src="../config.js"></script>

  <div class="app-shell">
    <app-nav active="upload"></app-nav>

    <main class="app-main app-main-narrow">
      <section class="card processing-card">
        <div id="loadingState">
          <h1 id="statusHeading">Processing your match</h1>
          <p id="stageLabel" class="stage-label stage-label-active">queued</p>

          <div class="progress-track">
            <div id="progressFill" class="progress-fill" style="width: 0%"></div>
          </div>
          <p id="progressPercent" class="progress-percent">0%</p>
        </div>

        <div id="errorState" class="hidden">
          <h1>Something went wrong</h1>
          <p id="errorMessage" class="stage-label"></p>
          <a class="btn btn-secondary" href="../upload/index.html">Try another upload</a>
        </div>

        <div id="doneState" class="hidden">
          <h1>Analysis complete</h1>
          <p class="stage-label">Shot classification, rally analytics, and coaching are ready.</p>
          <a id="viewResultsLink" class="btn btn-primary" href="#">View full results</a>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="./processing.js"></script>
</body>
</html>
