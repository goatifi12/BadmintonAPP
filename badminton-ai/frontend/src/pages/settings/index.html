<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — Badminton AI</title>
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="../../components/app-nav/app-nav.css" />
  <link rel="stylesheet" href="../../styles/app-shell.css" />
  <link rel="stylesheet" href="./settings.css" />
</head>
<body>
  <script src="../config.js"></script>

  <div class="app-shell">
    <app-nav active="settings"></app-nav>

    <main class="app-main app-main-narrow">
      <h1 class="settings-title">Settings</h1>

      <section class="card settings-card">
        <h2>Profile</h2>
        <dl class="profile-list">
          <div>
            <dt>Name</dt>
            <dd id="profileName">—</dd>
          </div>
          <div>
            <dt>Email</dt>
            <dd id="profileEmail">—</dd>
          </div>
        </dl>
      </section>

      <section class="card settings-card">
        <h2>Appearance</h2>
        <p class="settings-hint">Choose how Badminton AI looks on this device.</p>
        <div class="theme-options" role="radiogroup" aria-label="Theme">
          <button class="theme-option" data-theme-option="system">System</button>
          <button class="theme-option" data-theme-option="light">Light</button>
          <button class="theme-option" data-theme-option="dark">Dark</button>
        </div>
      </section>

      <section class="card settings-card">
        <h2>Account</h2>
        <p class="settings-hint">Sign out of Badminton AI on this device.</p>
        <button id="signOutBtn" class="btn btn-secondary">Sign out</button>
      </section>
    </main>
  </div>
  <script type="module" src="./settings.js"></script>
</body>
</html>
