<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload a match — Badminton AI</title>
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="../../components/app-nav/app-nav.css" />
  <link rel="stylesheet" href="../../styles/app-shell.css" />
  <link rel="stylesheet" href="./upload.css" />
</head>
<body>
  <script src="../config.js"></script>

  <div class="app-shell">
    <app-nav active="upload"></app-nav>

    <main class="app-main app-main-narrow">
      <section class="card upload-card">
        <h1>Upload a match</h1>
        <p class="upload-subtitle">MP4, MOV, or MKV. We'll process it and hand you back shot, rally, and movement analytics.</p>

        <div id="formError" class="form-error" role="alert"></div>

        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="Choose a video file">
          <input id="fileInput" type="file" accept="video/*" class="visually-hidden" />
          <div id="dropzoneEmpty" class="dropzone-empty">
            <p class="dropzone-title">Drag and drop your video here</p>
            <p class="dropzone-hint">or click to browse</p>
          </div>
          <div id="dropzoneFile" class="dropzone-file hidden">
            <p id="fileName" class="file-name"></p>
            <p id="fileSize" class="file-size"></p>
          </div>
        </div>

        <div class="mode-row">
          <label class="field-label" for="modeSelect">Match type</label>
          <select id="modeSelect" class="field mode-select">
            <option value="singles">Singles</option>
            <option value="doubles">Doubles</option>
          </select>
        </div>

        <button id="submitBtn" class="btn btn-primary btn-block" disabled>Upload and analyze</button>
      </section>
    </main>
  </div>
  <script type="module" src="./upload.js"></script>
</body>
</html>
