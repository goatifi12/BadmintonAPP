<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — Badminton AI</title>
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="./register.css" />
</head>
<body>
  <script src="../config.js"></script>

  <main class="auth-shell">
    <div class="auth-card card">
      <a class="auth-brand" href="../../../index.html">
        <span class="brand-mark">BA</span>
        <span>Badminton AI</span>
      </a>
      <h1>Create your account</h1>
      <p class="auth-subtitle">Start uploading matches and get AI coaching in minutes.</p>

      <div id="formError" class="form-error" role="alert"></div>

      <form id="registerForm" class="auth-form" novalidate>
        <div>
          <label class="field-label" for="displayName">Name</label>
          <input class="field" id="displayName" name="displayName" type="text" autocomplete="name" required />
        </div>
        <div>
          <label class="field-label" for="email">Email</label>
          <input class="field" id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div>
          <label class="field-label" for="password">Password</label>
          <input class="field" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required />
          <p class="field-hint">At least 8 characters.</p>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Create account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="../login/index.html">Sign in</a></p>
    </div>
  </main>
  <script type="module" src="./register.js"></script>
</body>
</html>
