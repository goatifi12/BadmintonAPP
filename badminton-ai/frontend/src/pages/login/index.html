<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Badminton AI</title>
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="./login.css" />
</head>
<body>
  <script src="../config.js"></script>

  <main class="auth-shell">
    <div class="auth-card card">
      <a class="auth-brand" href="../../../index.html">
        <span class="brand-mark">BA</span>
        <span>Badminton AI</span>
      </a>
      <h1>Welcome back</h1>
      <p class="auth-subtitle">Sign in to view your match analyses.</p>

      <div id="formError" class="form-error" role="alert"></div>

      <form id="loginForm" class="auth-form" novalidate>
        <div>
          <label class="field-label" for="email">Email</label>
          <input class="field" id="email" name="email" type="email" autocomplete="email" required />
        </div>
        <div>
          <label class="field-label" for="password">Password</label>
          <input class="field" id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Sign in</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="../register/index.html">Create one</a></p>
    </div>
  </main>
  <script type="module" src="./login.js"></script>
</body>
</html>
