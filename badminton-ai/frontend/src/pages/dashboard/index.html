<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Badminton AI</title>
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="../../components/app-nav/app-nav.css" />
  <link rel="stylesheet" href="../../styles/app-shell.css" />
  <link rel="stylesheet" href="../../styles/job-card.css" />
  <link rel="stylesheet" href="./dashboard.css" />
</head>
<body>
  <script src="../config.js"></script>

  <div class="app-shell">
    <app-nav active="dashboard"></app-nav>

    <main class="app-main">
      <section class="dashboard-hero-row">
        <div>
          <h1 id="welcomeHeading">Welcome back</h1>
          <p class="hero-subtitle">Upload a match to get shot, rally, and movement analytics.</p>
        </div>
        <a class="btn btn-primary" href="../upload/index.html">Upload a match</a>
      </section>

      <section class="card quick-stats-card">
        <div class="quick-stat">
          <span class="quick-stat-label">Total analyses</span>
          <span id="statTotal" class="quick-stat-value skeleton">00</span>
        </div>
        <div class="quick-stat">
          <span class="quick-stat-label">In progress</span>
          <span id="statProcessing" class="quick-stat-value skeleton">00</span>
        </div>
        <div class="quick-stat">
          <span class="quick-stat-label">Completed</span>
          <span id="statDone" class="quick-stat-value skeleton">00</span>
        </div>
      </section>

      <section class="recent-section">
        <div class="recent-header">
          <h2>Recent analyses</h2>
          <a href="../reports/index.html">View all</a>
        </div>
        <div id="recentList" class="recent-list"></div>
        <div id="emptyState" class="card empty-state hidden">
          <p>No analyses yet.</p>
          <a class="btn btn-primary" href="../upload/index.html">Upload your first match</a>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="./dashboard.js"></script>
</body>
</html>
