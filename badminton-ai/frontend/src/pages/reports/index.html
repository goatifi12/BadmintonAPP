<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reports — Badminton AI</title>
  <link rel="stylesheet" href="../../styles/base.css" />
  <link rel="stylesheet" href="../../components/app-nav/app-nav.css" />
  <link rel="stylesheet" href="../../styles/app-shell.css" />
  <link rel="stylesheet" href="../../styles/job-card.css" />
  <link rel="stylesheet" href="./reports.css" />
</head>
<body>
  <script src="../config.js"></script>

  <div class="app-shell">
    <app-nav active="reports"></app-nav>

    <main class="app-main">
      <div class="reports-header">
        <h1>Reports</h1>
        <a class="btn btn-primary" href="../upload/index.html">Upload a match</a>
      </div>

      <div class="filter-row">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="done">Done</button>
        <button class="filter-chip" data-filter="processing">In progress</button>
        <button class="filter-chip" data-filter="error">Errors</button>
      </div>

      <div id="jobList" class="recent-list"></div>
      <div id="emptyState" class="card empty-state hidden">
        <p>No analyses match this filter.</p>
      </div>
    </main>
  </div>
  <script type="module" src="./reports.js"></script>
</body>
</html>
